<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: #073b66;

    background:
      linear-gradient(
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.15)
      ),
      url("TFT.png");

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  /* =========================
     PAGE
  ========================== */

  .page {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    padding: 50px 20px 70px;
  }

  /* =========================
     GRANDE CARTE
  ========================== */

  .card {
    width: min(92vw, 820px);

    margin-top: 20px;

    padding: 45px 48px 38px;

    text-align: center;

    background: rgba(255,255,255,0.96);

    border: 1px solid rgba(255,255,255,0.95);
    border-radius: 35px;

    box-shadow:
      0 20px 60px rgba(0,45,80,0.25);

    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
  }

  /* =========================
     TFT
  ========================== */

  .brand {
    font-family: Georgia, "Times New Roman", serif;

    font-size: 58px;
    line-height: 1;

    font-weight: 700;

    color: #0875a8;

    margin-bottom: 10px;
  }

  .route {
    color: #0875a8;

    font-size: 20px;
    font-weight: 700;

    letter-spacing: 2px;

    margin-bottom: 38px;
  }

  /* =========================
     TITRE
  ========================== */

  h1 {
    color: #071f6b;

    font-size: 50px;
    line-height: 1.1;

    margin-bottom: 17px;
  }

  .description {
    max-width: 650px;

    margin: 0 auto 35px;

    color: #536273;

    font-size: 19px;
    line-height: 1.6;
  }

  /* =========================
     BOUTONS
  ========================== */

  .contact-button {
    width: 100%;

    min-height: 100px;

    display: flex;
    align-items: center;

    margin: 18px 0;

    padding: 18px 25px;

    color: white;
    text-decoration: none;

    border-radius: 22px;

    box-shadow:
      0 9px 24px rgba(0,0,0,0.16);

    transition:
      transform 0.2s ease,
      box-shadow 0.2s ease,
      filter 0.2s ease;
  }

  .contact-button:hover {
    transform: translateY(-4px);

    box-shadow:
      0 14px 32px rgba(0,0,0,0.22);

    filter: brightness(1.04);
  }

  .contact-button:active {
    transform: scale(0.985);
  }

  /* FACEBOOK */

  .facebook {
    background:
      linear-gradient(
        135deg,
        #2585f5,
        #0866d8
      );
  }

  /* INSTAGRAM */

  .instagram {
    background:
      linear-gradient(
        135deg,
        #ff7a28 0%,
        #f43f5e 30%,
        #c13584 62%,
        #833ab4 100%
      );
  }

  /* WHATSAPP */

  .whatsapp {
    background:
      linear-gradient(
        135deg,
        #25d366,
        #08a83d
      );
  }

  /* =========================
     ICONES
  ========================== */

  .icon {
    width: 68px;
    height: 68px;

    min-width: 68px;

    display: flex;
    justify-content: center;
    align-items: center;

    margin-right: 24px;

    background: white;

    border-radius: 50%;

    font-size: 32px;
    font-weight: 700;
  }

  .facebook .icon {
    color: #1877f2;

    font-size: 42px;
  }

  .instagram .icon {
    color: #c13584;

    font-size: 32px;
  }

  .whatsapp .icon {
    color: #10ae48;

    font-size: 30px;
  }

  /* =========================
     TEXTE BOUTONS
  ========================== */

  .button-content {
    flex: 1;

    text-align: left;
  }

  .button-title {
    display: block;

    margin-bottom: 5px;

    font-size: 26px;
    font-weight: 700;
  }

  .button-subtitle {
    display: block;

    font-size: 18px;
    font-weight: 400;

    opacity: 0.96;
  }

  .arrow {
    margin-left: 15px;

    font-size: 45px;
    font-weight: 300;
  }

  /* =========================
     SERVICES
  ========================== */

  .services {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 15px;

    margin-top: 42px;
    padding-top: 32px;

    border-top: 1px solid #d8e7ef;
  }

  .service {
    padding: 10px 5px;
  }

  .service-icon {
    margin-bottom: 10px;

    font-size: 34px;
  }

  .service-text {
    color: #164b73;

    font-size: 14px;
    font-weight: 700;

    line-height: 1.35;
  }

  /* =========================
     FOOTER
  ========================== */

  .footer {
    margin-top: 35px;
    padding-top: 30px;

    border-top: 1px solid #d8e7ef;
  }

  .footer-logo {
    margin-bottom: 7px;

    color: #0875a8;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 46px;
    font-weight: 700;
  }

  .arabic {
    margin-bottom: 18px;

    color: #0875a8;

    font-size: 30px;
    font-weight: 700;
  }

  .scan {
    color: #718092;

    font-size: 17px;
  }

  /* =========================
     TABLETTE
  ========================== */

  @media (max-width: 900px) {

    .card {
      width: min(94vw, 720px);

      padding: 38px 32px;
    }

    h1 {
      font-size: 43px;
    }

    .brand {
      font-size: 52px;
    }

    .contact-button {
      min-height: 92px;
    }
  }

  /* =========================
     TELEPHONE
  ========================== */

  @media (max-width: 600px) {

    body {
      background-attachment: scroll;

      background-position: center top;
    }

    .page {
      min-height: 100vh;

      padding: 16px 10px 30px;
    }

    .card {
      width: 100%;

      margin-top: 0;

      padding: 28px 16px;

      border-radius: 25px;
    }

    .brand {
      font-size: 42px;
    }

    .route {
      font-size: 14px;

      letter-spacing: 1px;

      margin-bottom: 25px;
    }

    h1 {
      font-size: 32px;

      margin-bottom: 12px;
    }

    .description {
      font-size: 15px;

      margin-bottom: 24px;
    }

    .contact-button {
      min-height: 78px;

      margin: 13px 0;

      padding: 12px 14px;

      border-radius: 17px;
    }

    .icon {
      width: 50px;
      height: 50px;

      min-width: 50px;

      margin-right: 13px;

      font-size: 23px;
    }

    .facebook .icon {
      font-size: 31px;
    }

    .instagram .icon {
      font-size: 24px;
    }

    .whatsapp .icon {
      font-size: 22px;
    }

    .button-title {
      font-size: 17px;
    }

    .button-subtitle {
      font-size: 13px;

      overflow-wrap: anywhere;
    }

    .arrow {
      margin-left: 7px;

      font-size: 29px;
    }

    .services {
      grid-template-columns: repeat(2, 1fr);

      gap: 12px;

      margin-top: 28px;
      padding-top: 23px;
    }

    .service-icon {
      font-size: 27px;
    }

    .service-text {
      font-size: 12px;
    }

    .footer {
      margin-top: 25px;

      padding-top: 22px;
    }

    .footer-logo {
      font-size: 37px;
    }

    .arabic {
      font-size: 22px;
    }

    .scan {
      font-size: 13px;
    }
  }

  /* =========================
     PETITS TELEPHONES
  ========================== */

  @media (max-width: 380px) {

    .card {
      padding-left: 12px;
      padding-right: 12px;
    }

    .button-title {
      font-size: 15px;
    }

    .button-subtitle {
      font-size: 11px;
    }

    .icon {
      margin-right: 9px;
    }
  }
</style>
